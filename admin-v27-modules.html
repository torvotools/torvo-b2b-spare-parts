<!-- TORVO V27 OPERATIONAL CLOUD MODULES -->
<template id="v27Dealers"><section class="v27module"><header><h2>DEALERS</h2><button>+ NEW DEALER / INQUIRY</button></header><nav><b>ALL DEALERS</b><span>PENDING APPROVAL</span><span>ACTIVE</span><span>BLOCKED</span><span>INACTIVE</span></nav><div class="tools"><input placeholder="SEARCH SHOP, PERSON, MOBILE, CITY"><select><option>ALL STATE</option></select><select><option>ALL STATUS</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>DEALER CODE</th><th>SHOP / CONTACT</th><th>MOBILE</th><th>CITY</th><th>RATE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="7">NO DATA</td></tr></tbody></table></div></section></template>
<template id="v27Orders"><section class="v27module"><header><h2>ORDERS</h2><button>+ CREATE ORDER</button></header><nav><b>ALL</b><span>NEW</span><span>PROCESSING</span><span>READY</span><span>DISPATCHED</span><span>DELIVERED</span></nav><div class="tools"><input placeholder="SEARCH ORDER, DEALER, ITEM"><input type="date"><select><option>ALL STATUS</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>ORDER NO</th><th>DATE</th><th>DEALER</th><th>ITEMS</th><th>AMOUNT</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="7">NO DATA</td></tr></tbody></table></div></section></template>
<template id="v27Quotation"><section class="v27module"><header><h2>QUOTATION</h2><button>+ NEW QUOTATION</button></header><nav><b>ALL</b><span>DRAFT</span><span>SENT</span><span>ACCEPTED</span><span>REJECTED</span></nav><div class="tools"><input placeholder="SEARCH QUOTATION / DEALER"><select><option>ALL STATUS</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>QUOTATION NO</th><th>DATE</th><th>DEALER</th><th>TOTAL</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="6">NO DATA</td></tr></tbody></table></div></section></template>
<template id="v27Sales"><section class="v27module"><header><h2>SALES ORDER</h2><button>+ NEW SALES ORDER</button></header><nav><b>ALL</b><span>OPEN</span><span>FINAL</span><span>ESTIMATE CREATED</span></nav><div class="tools"><input placeholder="SEARCH SALES ORDER / DEALER"><select><option>ALL STATUS</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>SALES ORDER</th><th>DEALER</th><th>PRODUCT VALUE</th><th>FREIGHT / CHARGES</th><th>PAYABLE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="7">NO DATA</td></tr></tbody></table></div></section></template>
<template id="v27Estimates"><section class="v27module"><header><h2>ESTIMATES</h2><button>+ NEW ESTIMATE</button></header><nav><b>ALL</b><span>PENDING</span><span>APPROVED</span><span>PAYMENT RECEIVED</span><span>DELIVERED</span></nav><div class="tools"><input placeholder="SEARCH ESTIMATE / DEALER"><select><option>ALL PAYMENT</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>ESTIMATE NO</th><th>DEALER</th><th>AMOUNT</th><th>PAYMENT</th><th>DELIVERY</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="7">NO DATA</td></tr></tbody></table></div><div class="rule">STOCK WILL NOT REDUCE ON ESTIMATE APPROVAL. STOCK REDUCTION IS ALLOWED ONLY ON FINAL DELIVERY AFTER PAYMENT RECEIVED, ONCE ONLY.</div></section></template>
<template id="v27Reports"><section class="v27module"><header><h2>REPORTS CENTER</h2></header><div class="reportgrid"><button>SALES REPORT</button><button>PROFIT / INCOME</button><button>ORDER VS ESTIMATE</button><button>FINAL ESTIMATE / ACTUAL SALES</button><button>PENDING / UNFULFILLED</button><button>EXPENSE</button><button>STOCK / INVENTORY</button><button>LOW / REORDER</button><button>DELIVERY / TRACKING</button><button>DEALER APPROVALS</button><button>REQUESTS</button><button>MESSAGES</button><button>MACHINE-WISE ORIGINAL PARTS</button><button>MACHINE-WISE SUITABLE PARTS</button><button>PART-WISE MACHINE FITMENT</button><button>UNMAPPED PARTS</button></div></section></template>
<template id="v27Requests"><section class="v27module"><header><h2>DEALER REQUESTS</h2><button>+ MANUAL REQUEST FORM</button></header><nav><b>ALL</b><span>NEW</span><span>VIEWED</span><span>HOLD / CALL BACK</span><span>APPROVED</span><span>REJECTED</span></nav><div class="data"><table><thead><tr><th>REQUEST</th><th>DEALER</th><th>DATE</th><th>TYPE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="6">NO DATA</td></tr></tbody></table></div></section></template>
<style>.v27module{height:100%;display:flex;flex-direction:column;min-height:0}.v27module header{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px}.v27module h2{margin:0;font-size:17px}.v27module header button{background:#d71920;color:#fff;border:0;border-radius:3px;padding:8px 11px;font-weight:900}.v27module nav{display:flex;gap:3px;background:#fff;border:1px solid #dce3eb;border-radius:4px;padding:4px;overflow:auto}.v27module nav span,.v27module nav b{padding:6px 9px;white-space:nowrap;font-size:9px}.v27module nav b{background:#0b2344;color:#fff;border-radius:3px}.v27module .tools{display:flex;gap:5px;padding:6px 0}.v27module .tools input,.v27module .tools select{border:1px solid #cfd8e3;border-radius:3px;padding:7px;min-width:130px}.v27module .tools input:first-child{flex:1}.v27module .tools button{border:0;border-radius:3px;background:#1768b0;color:#fff;padding:7px 11px;font-weight:900}.v27module .data{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #dce3eb;border-radius:4px}.v27module table{width:100%;border-collapse:collapse;font-size:9px}.v27module th,.v27module td{padding:7px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.v27module th{position:sticky;top:0;background:#f7f9fc}.v27module .rule{flex:none;margin-top:6px;background:#fff7ed;border-left:3px solid #e47b18;padding:7px;font-size:9px;font-weight:900}.reportgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;overflow:auto}.reportgrid button{min-height:72px;background:#fff;border:1px solid #dce3eb;border-radius:5px;font-weight:900;color:#172033}@media(max-width:900px){.v27module .tools{flex-wrap:wrap}.v27module .tools input:first-child{min-width:100%}.reportgrid{grid-template-columns:repeat(2,1fr)}}</style>
