<template id="v27Products"><section class="m"><header><h2>PRODUCT MASTER</h2><button>+ ADD PRODUCT</button></header><nav><b>ALL PRODUCTS</b><span>SPARE PARTS</span><span>MACHINES</span><span>ACCESSORIES</span><span>IN STOCK</span><span>LOW STOCK</span><span>OUT OF STOCK</span></nav><div class="tools"><input placeholder="SEARCH ITEM NO, PRODUCT, MODEL, DRAWING CODE"><select><option>ALL BRAND</option></select><select><option>ALL CATEGORY</option></select><button>SEARCH</button></div><div class="data"><table><thead><tr><th>ITEM NO</th><th>PRODUCT</th><th>BRAND</th><th>CATEGORY</th><th>ORIGINAL FOR</th><th>SUITABLE FOR</th><th>STOCK</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr><td colspan="9">NO DATA</td></tr></tbody></table></div></section></template>

<style>.m{height:100%;display:flex;flex-direction:column;min-height:0}.m header{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px}.m h2{margin:0;font-size:17px}.m header>button,.addrow button{background:#d71920;color:#fff;border:0;border-radius:3px;padding:8px 11px;font-weight:900}.m nav{display:flex;gap:3px;background:#fff;border:1px solid #dce3eb;border-radius:4px;padding:4px;overflow:auto}.m nav span,.m nav b{padding:6px 9px;white-space:nowrap;font-size:9px}.m nav b{background:#0b2344;color:#fff;border-radius:3px}.tools{display:flex;gap:5px;padding:6px 0}.tools input,.tools select,.wide,.addrow input{border:1px solid #cfd8e3;border-radius:3px;padding:7px}.tools input{flex:1}.tools button{border:0;border-radius:3px;background:#1768b0;color:#fff;padding:7px 11px;font-weight:900}.data{flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid #dce3eb;border-radius:4px}.data table{width:100%;border-collapse:collapse;font-size:9px}.data th,.data td{padding:7px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.data th{position:sticky;top:0;background:#f7f9fc}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}.twocol article{background:#fff;border:1px solid #dce3eb;border-radius:5px;padding:10px}.twocol h3{margin:0 0 8px}.addrow{display:flex;gap:4px}.addrow input{flex:1}.wide{width:100%;margin-top:6px}.minirows{margin-top:6px;border:1px solid #edf0f4;border-radius:3px;min-height:160px;padding:8px;color:#718096}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.settings button{background:#fff;border:1px solid #dce3eb;border-radius:5px;min-height:75px;font-weight:900}.warning{margin:6px 0;background:#fff1f2;border-left:3px solid #d71920;padding:7px;font-size:9px;font-weight:900}@media(max-width:900px){.tools{flex-wrap:wrap}.tools input{min-width:100%}.twocol{grid-template-columns:1fr}.settings{grid-template-columns:repeat(2,1fr)}}</style>
