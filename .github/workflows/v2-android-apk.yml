name: TORVO V2 Android APK

on:
  workflow_dispatch:
  push:
    branches: [torvo-v2-build]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'docs/TORVO-V2-RELEASE-GATES.md'
      - 'docs/TORVO-V2-STAGING-ACCEPTANCE.md'
      - 'docs/TORVO-V2-MASTER-HANDOVER.md'
      - 'docs/TORVO-V2-PORTABLE-RESTORE-RUNBOOK.md'
      - 'docs/TORVO-V2-RESTORE-GUIDE.md'
      - 'docs/TORVO-V2-ENVIRONMENT-INVENTORY.md'
      - 'docs/TORVO-V2-PUBLIC-WEB-APP-ARCHITECTURE.md'
      - 'docs/TORVO-V2-FINAL-DEMO-RUNBOOK.md'
      - 'docs/TORVO-V2-OWNER-REQUIREMENTS-LOCK.md'
      - 'supabase/v2-*.sql'
      - 'supabase/functions/**'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-android-apk.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: torvo-v2-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RELEASE_TAG: torvo-v2-test-latest
  TEST_RELEASE_ASSET: TORVO-TOOLS-TEST-latest.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: CHECKOUT EXACT V2 COMMIT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: VERIFY V2 BRANCH BOUNDARY
        run: test "${GITHUB_REF_NAME}" = "torvo-v2-build"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: INSTALL
        run: npm install --no-audit --no-fund
      - name: VERIFY SCRIPT SYNTAX AND PERMANENT APP IDENTITY
        run: npm run verify:v2-preflight
      - name: VERIFY FULL V2 RELEASE CONTRACT
        run: |
          npm run verify:v2-auth
          npm run verify:v2-ready
          npm run verify:v2-dealer-business
          npm run verify:v2-release-gates
          npm run verify:v2-runtime
          npm run verify:v2-release-center
          npm run verify:v2-update-publish
          npm run verify:v2-salesman-attendance
      - name: BUILD VERIFIED V2 WEB ASSETS FOR NATIVE APP
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          npm run build:v2 2>&1 | tee /tmp/torvo-native-build.log || {
            echo "::group::TORVO NATIVE BUILD ROOT ERROR"
            grep -n -B 15 -A 20 -E "ERROR|Error:|error:|failed|FAILED|Expected|Unexpected|Transform failed|Build failed|✗" /tmp/torvo-native-build.log | tail -n 300 || true
            echo "---- FINAL BUILD OUTPUT ----"
            tail -n 300 /tmp/torvo-native-build.log
            echo "::endgroup::"
            exit 1
          }
          rm -rf dist-app
          mkdir -p dist-app
          cp -R dist/. dist-app/
          test -f dist-app/index.html
          test -d dist-app/assets
          cp dist-app/index.html dist-app/v2.html
          grep -q 'torvo-v2-root' dist-app/v2.html
      - name: VERIFY CURRENT LOGIN UI
        run: |
          test -d dist-app/assets
          test -n "$(find dist-app/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' dist-app/assets; then echo 'PLACEHOLDER LOGIN FOUND IN COMPILED APP'; exit 1; fi
          echo "COMPILED APP ASSETS PRESENT; SOURCE LOGIN CONTRACT ALREADY VERIFIED BY V2 PREFLIGHT."
      - name: VERIFY NATIVE ENTRY AND EXACT SHA
        run: |
          test -f dist-app/v2.html
          grep -q 'torvo-v2-root' dist-app/v2.html
          cp dist-app/v2.html dist-app/index.html
          grep -q 'torvo-v2-root' dist-app/index.html
          printf '%s' "${GITHUB_SHA}" > dist-app/torvo-build-sha.txt
          test "$(cat dist-app/torvo-build-sha.txt)" = "${GITHUB_SHA}"
      - name: CREATE ANDROID PROJECT
        run: npx cap add android
      - name: SYNC ONE APP
        run: npx cap sync android
      - name: VERIFY ANDROID PACKAGE CONTINUITY
        run: |
          grep -R -q 'applicationId "com.torvotools.app"' android/app/build.gradle
          grep -R -q 'namespace "com.torvotools.app"' android/app/build.gradle
          test -x android/gradlew
      - name: VERIFY ANDROID SYNCED ASSET INTEGRITY
        run: |
          set -euo pipefail
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/v2.html
          test -d android/app/src/main/assets/public/assets
          test -n "$(find android/app/src/main/assets/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -f android/app/src/main/assets/public/torvo-build-sha.txt
          test "$(cat android/app/src/main/assets/public/torvo-build-sha.txt)" = "${GITHUB_SHA}"
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' android/app/src/main/assets/public/assets; then
            echo 'PLACEHOLDER LOGIN FOUND IN SYNCED ANDROID ASSET'
            exit 1
          fi
      - name: VERIFY ANDROID ASSET
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/v2.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/v2.html
      - name: BUILD DEBUG TEST APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "GRADLE BUILD ATTEMPT ${attempt}/3"
            if ./gradlew --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "GRADLE BUILD FAILED; RETRYING TRANSIENT DOWNLOAD/NETWORK FAILURE IN 10 SECONDS"
              sleep 10
            fi
          done
          echo "GRADLE BUILD FAILED AFTER 3 ATTEMPTS"
          exit 1
      - name: PREPARE VERIFIED TEST APK ARTIFACT
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA="${GITHUB_SHA::12}"; BUILD_NO="${GITHUB_RUN_NUMBER}"; APK_NAME="TORVO-TOOLS-TEST-v2-build-${BUILD_NO}-${SHORT_SHA}.apk"
          mkdir -p release-artifact durable-release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifact/${APK_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "durable-release/${TEST_RELEASE_ASSET}"
          SHA256="$(sha256sum "release-artifact/${APK_NAME}" | awk '{print $1}')"; BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test -n "${SHA256}"; test "${SHA256}" = "$(sha256sum "durable-release/${TEST_RELEASE_ASSET}" | awk '{print $1}')"
          printf '{\n  "app":"TORVO TOOLS",\n  "package":"com.torvotools.app",\n  "channel":"TEST-DEBUG",\n  "production_signed":false,\n  "build_number":"%s",\n  "commit_sha":"%s",\n  "build_date_utc":"%s",\n  "apk_file":"%s",\n  "apk_sha256":"%s",\n  "workflow_run_id":"%s",\n  "status":"VERIFIED_TEST"\n}\n' "$BUILD_NO" "$GITHUB_SHA" "$BUILD_DATE" "$APK_NAME" "$SHA256" "$GITHUB_RUN_ID" > release-artifact/release-manifest.json
          cp release-artifact/release-manifest.json durable-release/release-manifest.json
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"; echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
      - name: VERIFY TEST RELEASE MANIFEST
        run: |
          test -s release-artifact/release-manifest.json
          grep -q '"package":"com.torvotools.app"' release-artifact/release-manifest.json
          grep -q '"channel":"TEST-DEBUG"' release-artifact/release-manifest.json
          grep -q '"status":"VERIFIED_TEST"' release-artifact/release-manifest.json
          grep -q '"production_signed":false' release-artifact/release-manifest.json
          if grep -Eq '"production_signed"[[:space:]]*:[[:space:]]*true|"channel"[[:space:]]*:[[:space:]]*"(PRODUCTION|PLAY|STABLE)"' release-artifact/release-manifest.json; then echo 'TEST APK CANNOT CLAIM PRODUCTION'; exit 1; fi
          grep -q "${GITHUB_SHA}" release-artifact/release-manifest.json
          test -f "release-artifact/${{ steps.release_meta.outputs.apk_name }}"
          test -f "durable-release/${TEST_RELEASE_ASSET}"
      - name: UPLOAD VERSIONED VERIFIED TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: TORVO-TOOLS-TEST-APK-BUILD-${{ github.run_number }}-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: PUBLISH DURABLE TEST PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "torvo-v2-build"
          test -f "durable-release/${TEST_RELEASE_ASSET}"
          git tag -f "${TEST_RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TEST_RELEASE_TAG}" --force
          if gh release view "${TEST_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${TEST_RELEASE_TAG}" --title "TORVO TOOLS VERIFIED TEST APK" --notes "TEST-DEBUG ONLY. NOT PRODUCTION SIGNED. PACKAGE: com.torvotools.app. COMMIT: ${GITHUB_SHA}. SHA256: ${{ steps.release_meta.outputs.sha256 }}." --prerelease
          else
            gh release create "${TEST_RELEASE_TAG}" --title "TORVO TOOLS VERIFIED TEST APK" --notes "TEST-DEBUG ONLY. NOT PRODUCTION SIGNED. PACKAGE: com.torvotools.app. COMMIT: ${GITHUB_SHA}. SHA256: ${{ steps.release_meta.outputs.sha256 }}." --prerelease --target "${GITHUB_SHA}"
          fi
          gh release upload "${TEST_RELEASE_TAG}" "durable-release/${TEST_RELEASE_ASSET}" "durable-release/release-manifest.json" --clobber
      - name: VERIFY DURABLE TEST PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${TEST_RELEASE_TAG}" --json isPrerelease,tagName --jq 'select(.isPrerelease == true and .tagName == "torvo-v2-test-latest")' >/dev/null
          gh release view "${TEST_RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx "${TEST_RELEASE_ASSET}"
          gh release view "${TEST_RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx 'release-manifest.json'
      - name: TEST APK EVIDENCE
        run: |
          echo "### TORVO TOOLS ANDROID TEST APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- PACKAGE: com.torvotools.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: ${{ steps.release_meta.outputs.apk_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: ${{ steps.release_meta.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CHANNEL: TEST-DEBUG (NOT PLAY STORE PRODUCTION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- DURABLE TEST APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TEST_RELEASE_TAG}/${TEST_RELEASE_ASSET}" >> "$GITHUB_STEP_SUMMARY"
