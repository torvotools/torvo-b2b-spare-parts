name: TORVO V2 Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TORVO V2 Build Check"]
    types: [completed]
    branches: [torvo-v2-build]

permissions:
  contents: write
  actions: read

concurrency:
  group: torvo-v2-android-apk
  cancel-in-progress: true

env:
  TEST_RELEASE_TAG: torvo-v2-test-latest
  TEST_RELEASE_ASSET: TORVO-TOOLS-TEST-latest.apk

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    timeout-minutes: 25
    steps:
      - name: CHECKOUT EXACT V2 COMMIT
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: VERIFY V2 BRANCH BOUNDARY
        run: test "${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}" = "torvo-v2-build"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: INSTALL
        run: npm install --no-audit --no-fund
      - name: VERIFY SCRIPT SYNTAX AND PERMANENT APP IDENTITY
        run: npm run verify:v2-preflight
      - name: VERIFY FULL V2 RELEASE CONTRACT
        run: |
          npm run verify:v2-auth
          npm run verify:v2-ready
          npm run verify:v2-dealer-business
          npm run verify:v2-release-gates
          npm run verify:v2-runtime
          npm run verify:v2-release-center
          npm run verify:v2-update-publish
          npm run verify:v2-salesman-attendance
          npm run verify:v2-final-readiness
      - name: BUILD VERIFIED V2 WEB ASSETS FOR NATIVE APP
        env:
          VITE_BUILD_SHA: ${{ env.SOURCE_SHA }}
          VITE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          npm run build:app 2>&1 | tee /tmp/torvo-native-build.log || {
            echo "::group::TORVO NATIVE BUILD ROOT ERROR"
            grep -n -B 15 -A 20 -E "ERROR|Error:|error:|failed|FAILED|Expected|Unexpected|Transform failed|Build failed|✗" /tmp/torvo-native-build.log | tail -n 300 || true
            echo "---- FINAL BUILD OUTPUT ----"
            tail -n 300 /tmp/torvo-native-build.log
            echo "::endgroup::"
            exit 1
          }
          test -f dist-app/v2.html
          test -d dist-app/assets
          grep -q 'torvo-v2-root' dist-app/v2.html
      - name: DIAGNOSE RETIRED LOGIN TEXT IN NATIVE BUNDLE
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const terms=['REGISTERED MOBILE NUMBER','STAFF LOGIN USES WHATSAPP OTP','10-DIGIT MOBILE NUMBER'];
          const dir='dist-app/assets';
          for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.js'))){
            const content=fs.readFileSync(path.join(dir,file),'utf8');
            for(const term of terms){
              let pos=content.indexOf(term);
              while(pos!==-1){
                const context=content.slice(Math.max(0,pos-110),Math.min(content.length,pos+term.length+110)).replace(/\s+/g,' ');
                console.log('RETIRED LOGIN TEXT:',JSON.stringify({file,term,context}));
                pos=content.indexOf(term,pos+term.length);
              }
            }
          }
          NODE
      - name: VERIFY CURRENT LOGIN UI
        run: |
          test -d dist-app/assets
          test -n "$(find dist-app/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' dist-app/assets; then echo 'PLACEHOLDER LOGIN FOUND IN COMPILED APP'; exit 1; fi
          if grep -R -q 'REGISTERED MOBILE NUMBER\|STAFF LOGIN USES WHATSAPP OTP' dist-app/assets; then echo 'RETIRED MOBILE/WHATSAPP LOGIN FOUND IN COMPILED APP'; exit 1; fi
          grep -R -q 'REGISTERED EMAIL' dist-app/assets
          grep -R -q 'USER ID' dist-app/assets
          grep -R -q 'NEW DEALER REGISTRATION' dist-app/assets
          echo "COMPILED NATIVE APP HAS DEALER EMAIL + STAFF USER ID + REGISTRATION LOGIN CONTRACT."
      - name: VERIFY NATIVE ENTRY AND EXACT SHA
        run: |
          test -f dist-app/v2.html
          grep -q 'torvo-v2-root' dist-app/v2.html
          cp dist-app/v2.html dist-app/index.html
          grep -q 'torvo-v2-root' dist-app/index.html
          printf '%s' "${SOURCE_SHA}" > dist-app/torvo-build-sha.txt
          test "$(cat dist-app/torvo-build-sha.txt)" = "${SOURCE_SHA}"
      - name: CREATE ANDROID PROJECT
        run: npx cap add android
      - name: SYNC ONE APP
        run: npx cap sync android
      - name: VERIFY ANDROID PACKAGE CONTINUITY
        run: |
          grep -R -q 'applicationId "com.torvotools.app"' android/app/build.gradle
          grep -R -q 'namespace "com.torvotools.app"' android/app/build.gradle
          test -x android/gradlew
      - name: VERIFY ANDROID SYNCED ASSET INTEGRITY
        run: |
          set -euo pipefail
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/v2.html
          test -d android/app/src/main/assets/public/assets
          test -n "$(find android/app/src/main/assets/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -f android/app/src/main/assets/public/torvo-build-sha.txt
          test "$(cat android/app/src/main/assets/public/torvo-build-sha.txt)" = "${SOURCE_SHA}"
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' android/app/src/main/assets/public/assets; then
            echo 'PLACEHOLDER LOGIN FOUND IN SYNCED ANDROID ASSET'
            exit 1
          fi
          if grep -R -q 'REGISTERED MOBILE NUMBER\|STAFF LOGIN USES WHATSAPP OTP' android/app/src/main/assets/public/assets; then
            echo 'RETIRED MOBILE/WHATSAPP LOGIN FOUND IN SYNCED ANDROID ASSET'
            exit 1
          fi
          grep -R -q 'REGISTERED EMAIL' android/app/src/main/assets/public/assets
          grep -R -q 'USER ID' android/app/src/main/assets/public/assets
          grep -R -q 'NEW DEALER REGISTRATION' android/app/src/main/assets/public/assets
      - name: VERIFY ANDROID ASSET
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/v2.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/v2.html
      - name: SET MONOTONIC ANDROID TEST VERSION CODE
        shell: bash
        env:
          TEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          const code = Number(process.env.TEST_VERSION_CODE);
          if (!Number.isSafeInteger(code) || code < 1 || code > 2100000000) throw Error('Invalid Android versionCode');
          const match = gradle.match(/\bversionCode\s+\d+/g) || [];
          if (match.length !== 1) throw Error('Expected exactly one Android versionCode');
          gradle = gradle.replace(/\bversionCode\s+\d+/, 'versionCode ' + code);
          fs.writeFileSync(path, gradle);
          if (!gradle.includes('versionCode ' + code)) throw Error('Android versionCode verification failed');
          console.log('TEST APK Android versionCode:', code);
          NODE
      - name: RECORD PREVIOUS INSTALLED TEST APK CERTIFICATE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior-test-release
          gh release download "${TEST_RELEASE_TAG}" --pattern "${TEST_RELEASE_ASSET}" --dir prior-test-release
          APK="prior-test-release/${TEST_RELEASE_ASSET}"
          test -s "$APK"
          ACTUAL_SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          # Pinned hash of the previously published TEST APK, independently read from GitHub release metadata.
          EXPECTED_SHA="7b6ad40acbf8bc9ddee04688d5662a6a0d64596585f154bdf3afd24b9bc9357e"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Previously published TEST APK changed unexpectedly; do not overwrite its signing evidence."
            exit 1
          fi
          BUILD_TOOLS="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          # Diagnose old APK verification without weakening the signing gate.
          if ! "$BUILD_TOOLS/apksigner" verify --verbose "$APK"; then
            echo "::error::Previous TEST APK signature verification failed; keeping release blocked."
            "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 "$APK" || true
            exit 1
          fi
          # Print certificate data separately: apksigner may emit warnings to stderr.
          CERT_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          OLD_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^[[:space:]]*Signer #1 certificate SHA-256 digest:[[:space:]]*([[:xdigit:]]{64})[[:space:]]*$/\1/p' | head -1 | tr '[:upper:]' '[:lower:]')"
          if [ "${#OLD_CERT}" -ne 64 ]; then
            echo "::error::Previous TEST APK certificate digest could not be extracted (expected 64 hex characters)."
            printf '%s\n' "$CERT_OUTPUT" | grep -E 'Signer #1 certificate|Verified using|Number of signers' || true
            exit 1
          fi
          printf '%s' "$OLD_CERT" > prior-test-release/previous-cert-sha256.txt
          echo "Previous TEST APK certificate SHA-256: $OLD_CERT" >> "$GITHUB_STEP_SUMMARY"
      - name: CONFIGURE PERSISTENT TEST APK SIGNING
        shell: bash
        env:
          TORVO_TEST_KEYSTORE_BASE64: ${{ secrets.TORVO_TEST_KEYSTORE_BASE64 }}
          TORVO_TEST_KEYSTORE_PASSWORD: ${{ secrets.TORVO_TEST_KEYSTORE_PASSWORD }}
          TORVO_TEST_KEY_ALIAS: ${{ secrets.TORVO_TEST_KEY_ALIAS }}
          TORVO_TEST_KEY_PASSWORD: ${{ secrets.TORVO_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in TORVO_TEST_KEYSTORE_BASE64 TORVO_TEST_KEYSTORE_PASSWORD TORVO_TEST_KEY_ALIAS TORVO_TEST_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing persistent TEST signing credential: ${key}"; exit 1; fi
          done
          mkdir -p android/.torvo-signing
          chmod 700 android/.torvo-signing
          printf '%s' "$TORVO_TEST_KEYSTORE_BASE64" | base64 --decode > android/.torvo-signing/test.jks
          chmod 600 android/.torvo-signing/test.jks
          test -s android/.torvo-signing/test.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // CI-only signing: credentials are supplied via GitHub Actions secrets.
          android {
              signingConfigs {
                  torvoTest {
                      storeFile file('../.torvo-signing/test.jks')
                      storePassword System.getenv('TORVO_TEST_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('TORVO_TEST_KEY_ALIAS')
                      keyPassword System.getenv('TORVO_TEST_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.torvoTest
                  }
              }
          }
          GRADLE
          echo "Persistent TEST signing configured without committing key material."
      - name: BUILD DEBUG TEST APK
        working-directory: android
        shell: bash
        env:
          TORVO_TEST_KEYSTORE_PASSWORD: ${{ secrets.TORVO_TEST_KEYSTORE_PASSWORD }}
          TORVO_TEST_KEY_ALIAS: ${{ secrets.TORVO_TEST_KEY_ALIAS }}
          TORVO_TEST_KEY_PASSWORD: ${{ secrets.TORVO_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "GRADLE BUILD ATTEMPT ${attempt}/3"
            if ./gradlew --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "GRADLE BUILD FAILED; RETRYING TRANSIENT DOWNLOAD/NETWORK FAILURE IN 10 SECONDS"
              sleep 10
            fi
          done
          echo "GRADLE BUILD FAILED AFTER 3 ATTEMPTS"
          exit 1
      - name: VERIFY APK SIGNATURE AND VERSION BEFORE PUBLISH
        shell: bash
        env:
          TORVO_TEST_KEYSTORE_PASSWORD: ${{ secrets.TORVO_TEST_KEYSTORE_PASSWORD }}
          TORVO_TEST_KEY_ALIAS: ${{ secrets.TORVO_TEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^package: name='com.torvotools.app' versionCode='${GITHUB_RUN_NUMBER}'"
          APK_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(keytool -list -v -keystore android/.torvo-signing/test.jks -storepass "$TORVO_TEST_KEYSTORE_PASSWORD" -alias "$TORVO_TEST_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$APK_CERT" ] || [ -z "$KEY_CERT" ] || [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "::error::APK signing certificate does not match the persistent TEST keystore"
            exit 1
          fi
          OLD_CERT="$(cat prior-test-release/previous-cert-sha256.txt)"
          if [ "$APK_CERT" != "$OLD_CERT" ]; then
            echo "::error::New TEST signing certificate differs from the previously published APK. In-place update is not possible. Publication blocked to preserve existing users."
            exit 1
          fi
          echo "APK signature, existing TEST certificate and versionCode verified."
      - name: PREPARE VERIFIED TEST APK ARTIFACT
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          SHORT_SHA="${SOURCE_SHA::12}"; BUILD_NO="${GITHUB_RUN_NUMBER}"; APK_NAME="TORVO-TOOLS-TEST-v2-build-${BUILD_NO}-${SHORT_SHA}.apk"
          mkdir -p release-artifact durable-release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifact/${APK_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "durable-release/${TEST_RELEASE_ASSET}"
          SHA256="$(sha256sum "release-artifact/${APK_NAME}" | awk '{print $1}')"; BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          test -n "${SHA256}"; test "${SHA256}" = "$(sha256sum "durable-release/${TEST_RELEASE_ASSET}" | awk '{print $1}')"
          printf '{\n  "app":"TORVO TOOLS",\n  "package":"com.torvotools.app",\n  "channel":"TEST-DEBUG",\n  "production_signed":false,\n  "build_number":"%s",\n  "commit_sha":"%s",\n  "build_date_utc":"%s",\n  "apk_file":"%s",\n  "apk_sha256":"%s",\n  "workflow_run_id":"%s",\n  "status":"VERIFIED_TEST"\n}\n' "$BUILD_NO" "$SOURCE_SHA" "$BUILD_DATE" "$APK_NAME" "$SHA256" "$GITHUB_RUN_ID" > release-artifact/release-manifest.json
          cp release-artifact/release-manifest.json durable-release/release-manifest.json
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"; echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
      - name: VERIFY TEST RELEASE MANIFEST
        run: |
          test -s release-artifact/release-manifest.json
          grep -q '"package":"com.torvotools.app"' release-artifact/release-manifest.json
          grep -q '"channel":"TEST-DEBUG"' release-artifact/release-manifest.json
          grep -q '"status":"VERIFIED_TEST"' release-artifact/release-manifest.json
          grep -q '"production_signed":false' release-artifact/release-manifest.json
          if grep -Eq '"production_signed"[[:space:]]*:[[:space:]]*true|"channel"[[:space:]]*:[[:space:]]*"(PRODUCTION|PLAY|STABLE)"' release-artifact/release-manifest.json; then echo 'TEST APK CANNOT CLAIM PRODUCTION'; exit 1; fi
          grep -q "${SOURCE_SHA}" release-artifact/release-manifest.json
          test -f "release-artifact/${{ steps.release_meta.outputs.apk_name }}"
          test -f "durable-release/${TEST_RELEASE_ASSET}"
      - name: UPLOAD VERSIONED VERIFIED TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: TORVO-TOOLS-TEST-APK-BUILD-${{ github.run_number }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: PUBLISH DURABLE TEST PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "torvo-v2-build"
          test -f "durable-release/${TEST_RELEASE_ASSET}"
          # Do not delete the last working TEST APK before a replacement is ready.
          if gh release view "${TEST_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${TEST_RELEASE_TAG}" "durable-release/${TEST_RELEASE_ASSET}" "durable-release/release-manifest.json" --clobber
            gh release edit "${TEST_RELEASE_TAG}" --title "TORVO TOOLS VERIFIED TEST APK" --notes "TEST-DEBUG ONLY. NOT PRODUCTION SIGNED. PACKAGE: com.torvotools.app. COMMIT: ${SOURCE_SHA}. SHA256: ${{ steps.release_meta.outputs.sha256 }}." --prerelease --target "${SOURCE_SHA}"
          else
            gh release create "${TEST_RELEASE_TAG}" --title "TORVO TOOLS VERIFIED TEST APK" --notes "TEST-DEBUG ONLY. NOT PRODUCTION SIGNED. PACKAGE: com.torvotools.app. COMMIT: ${SOURCE_SHA}. SHA256: ${{ steps.release_meta.outputs.sha256 }}." --prerelease --target "${SOURCE_SHA}" "durable-release/${TEST_RELEASE_ASSET}" "durable-release/release-manifest.json"
          fi
      - name: VERIFY DURABLE TEST PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${TEST_RELEASE_TAG}" --json isPrerelease,tagName --jq 'select(.isPrerelease == true and .tagName == "torvo-v2-test-latest")' >/dev/null
          gh release view "${TEST_RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx "${TEST_RELEASE_ASSET}"
          gh release view "${TEST_RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx 'release-manifest.json'
          # Verify the bytes actually served by the durable release, not just local build output.
          mkdir -p verified-release-download
          gh release download "${TEST_RELEASE_TAG}" --pattern "${TEST_RELEASE_ASSET}" --dir verified-release-download
          test -s "verified-release-download/${TEST_RELEASE_ASSET}"
          DOWNLOADED_SHA="$(sha256sum "verified-release-download/${TEST_RELEASE_ASSET}" | cut -d' ' -f1)"
          test "$DOWNLOADED_SHA" = "${{ steps.release_meta.outputs.sha256 }}" || { echo "::error::Published APK checksum differs from verified build"; exit 1; }
          gh release download "${TEST_RELEASE_TAG}" --pattern 'release-manifest.json' --dir verified-release-download
          cmp -s durable-release/release-manifest.json verified-release-download/release-manifest.json || { echo "::error::Published release manifest differs from verified build"; exit 1; }
      - name: TEST APK EVIDENCE
        run: |
          echo "### TORVO TOOLS ANDROID TEST APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- PACKAGE: com.torvotools.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: ${{ steps.release_meta.outputs.apk_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: ${{ steps.release_meta.outputs.sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CHANNEL: TEST-DEBUG (NOT PLAY STORE PRODUCTION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- DURABLE TEST APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TEST_RELEASE_TAG}/${TEST_RELEASE_ASSET}" >> "$GITHUB_STEP_SUMMARY"
