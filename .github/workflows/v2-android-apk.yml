name: TORVO V2 Android APK

on:
  workflow_dispatch:
  push:
    branches: [torvo-v2-build]
    paths:
      - 'src/v2/**'
      - 'public/**'
      - 'v2.html'
      - 'vite.app.config.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/v2-android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: INSTALL
        run: npm install --no-audit --no-fund
      - name: BUILD NATIVE APP
        run: npm run build:app
      - name: VERIFY CURRENT LOGIN UI
        run: |
          grep -R -q 'SECURE BUSINESS ACCESS' dist-app/assets
          grep -R -q 'MOBILE NUMBER' dist-app/assets
          grep -R -q 'WHATSAPP OTP' dist-app/assets
          grep -R -q '4-DIGIT PIN' dist-app/assets
          grep -R -q 'getRegistrations' dist-app/assets
          grep -R -q 'torvo-v2-' dist-app/assets
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' dist-app/assets; then echo 'PLACEHOLDER LOGIN FOUND IN COMPILED APP'; exit 1; fi
          if grep -R -q 'ROLE AND PERMISSION ARE VERIFIED BY THE TORVO BACKEND' dist-app/assets; then echo 'OLD TECHNICAL LOGIN COPY FOUND'; exit 1; fi
      - name: VERIFY NATIVE ENTRY
        run: |
          test -f dist-app/v2.html
          grep -q 'torvo-v2-root' dist-app/v2.html
          cp dist-app/v2.html dist-app/index.html
          test -f dist-app/index.html
          grep -q 'torvo-v2-root' dist-app/index.html
      - name: CREATE ANDROID PROJECT
        run: npx cap add android
      - name: SYNC ONE APP
        run: npx cap sync android
      - name: VERIFY ANDROID LOGIN AND CACHE FIX
        run: |
          grep -R -q 'SECURE BUSINESS ACCESS' android/app/src/main/assets/public/assets
          grep -R -q 'WHATSAPP OTP' android/app/src/main/assets/public/assets
          grep -R -q '4-DIGIT PIN' android/app/src/main/assets/public/assets
          grep -R -q 'getRegistrations' android/app/src/main/assets/public/assets
          grep -R -q 'torvo-v2-' android/app/src/main/assets/public/assets
          if grep -R -q 'LOGIN SERVICE IS NOT CONNECTED YET' android/app/src/main/assets/public/assets; then echo 'PLACEHOLDER LOGIN COPIED TO ANDROID'; exit 1; fi
          if grep -R -q 'ROLE AND PERMISSION ARE VERIFIED BY THE TORVO BACKEND' android/app/src/main/assets/public/assets; then echo 'OLD TECHNICAL LOGIN COPY COPIED TO ANDROID'; exit 1; fi
      - name: VERIFY ANDROID ASSET
        run: |
          test -f android/app/src/main/assets/public/index.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/v2.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/v2.html
      - name: BUILD DEBUG APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: UPLOAD APK
        uses: actions/upload-artifact@v4
        with:
          name: TORVO-TOOLS-DEBUG-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
