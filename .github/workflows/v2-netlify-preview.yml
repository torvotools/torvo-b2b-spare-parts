name: TORVO V2 Netlify Preview

on:
  workflow_dispatch:
  push:
    branches: [torvo-v2-build]

permissions:
  contents: read

concurrency:
  group: torvo-v2-netlify-preview
  cancel-in-progress: true

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 development branch
        uses: actions/checkout@v4
        with:
          ref: torvo-v2-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build isolated V2 preview
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build --config vite.v2-preview.config.js

      - name: Normalize and stamp exact preview build
        run: |
          test "${GITHUB_REF_NAME}" = "torvo-v2-build"
          test -f dist/v2-preview.html
          mv dist/v2-preview.html dist/index.html
          test -f dist/index.html
          printf '%s' "${GITHUB_SHA}" > dist/torvo-build-sha.txt
          echo "TORVO V2 preview ${GITHUB_SHA} ready."

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torvo-v2-netlify-preview
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Check Netlify deployment credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "NETLIFY_AUTH_TOKEN secret is required" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "NETLIFY_SITE_ID secret is required" && exit 1)

      - name: Deploy exact build to TORVO V2 preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --alias=torvo-v2-build --message="TORVO V2 ${GITHUB_SHA}"

      - name: Verify live preview is exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          LIVE_SHA="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 https://torvo-v2-build--torvo-v2-preview.netlify.app/torvo-build-sha.txt)"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "Verified live TORVO V2 preview SHA: $LIVE_SHA"
