name: TORVO V2 Netlify Preview

on:
  workflow_dispatch:
  # MANUAL PREVIEW ONLY: routine source commits must not generate failure-email noise.

permissions:
  contents: read

concurrency:
  group: torvo-v2-netlify-preview
  cancel-in-progress: true

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify V2 scripts and permanent app identity
        run: npm run verify:v2-ci
      - name: Build isolated V2 preview
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: vite build --config vite.v2-preview.config.js && node scripts/normalize-v2-build.mjs
      - name: Normalize and stamp exact preview build
        run: |
          test "${GITHUB_REF_NAME}" = "torvo-v2-build"
          test -f dist/index.html
          printf '%s' "${GITHUB_SHA}" > dist/torvo-build-sha.txt
          printf '%s\n' "BRANCH=${GITHUB_REF_NAME}" "SHA=${GITHUB_SHA}" "RUN_ID=${GITHUB_RUN_ID}" > dist/torvo-build-manifest.txt
          echo "TORVO V2 preview ${GITHUB_SHA} ready."
      - name: Upload exact preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torvo-v2-netlify-preview-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Detect Netlify deployment credentials
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "NETLIFY PREVIEW DEPLOYMENT ENABLED."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NETLIFY SECRETS NOT CONFIGURED; VERIFIED BUILD ARTIFACT REMAINS AVAILABLE."
          fi
      - name: Deploy exact build to TORVO V2 preview
        if: steps.netlify.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --alias=torvo-v2-build --message="TORVO V2 ${GITHUB_SHA}"
      - name: Verify live preview is exact commit
        if: steps.netlify.outputs.ready == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREVIEW_URL="https://torvo-v2-build--torvo-v2-preview.netlify.app"
          LIVE_SHA="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "${PREVIEW_URL}/torvo-build-sha.txt?sha=${EXPECTED_SHA}&run=${GITHUB_RUN_ID}")"
          LIVE_SHA="$(printf '%s' "$LIVE_SHA" | tr -d '\r\n[:space:]')"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          INDEX="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "${PREVIEW_URL}/")"
          printf '%s' "$INDEX" | grep -q 'TORVO'
          echo "Verified live TORVO V2 preview SHA: $LIVE_SHA"
          echo "LIVE PREVIEW: ${PREVIEW_URL}"
      - name: Record preview availability
        run: |
          echo "### TORVO V2 PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build artifact: uploaded for 14 days" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.netlify.outputs.ready }}" = "true" ]; then
            echo "- Netlify deploy: VERIFIED" >> "$GITHUB_STEP_SUMMARY"
            echo "- Live preview: https://torvo-v2-build--torvo-v2-preview.netlify.app" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Netlify deploy: WAITING FOR NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID" >> "$GITHUB_STEP_SUMMARY"
          fi
