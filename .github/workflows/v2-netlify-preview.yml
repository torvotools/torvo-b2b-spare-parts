name: TORVO V2 Netlify Preview

on:
  workflow_dispatch:
  push:
    branches: [torvo-v2-build]

permissions:
  contents: read

jobs:
  preview-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 development branch
        uses: actions/checkout@v4
        with:
          ref: torvo-v2-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build isolated V2 preview
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build --config vite.v2-preview.config.js

      - name: Normalize preview entry
        run: |
          test "${GITHUB_REF_NAME}" = "torvo-v2-build"
          test -f dist/v2-preview.html
          mv dist/v2-preview.html dist/index.html
          test -f dist/index.html
          echo "Isolated TORVO V2 preview build ${GITHUB_SHA} is ready at site root."

      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torvo-v2-netlify-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
