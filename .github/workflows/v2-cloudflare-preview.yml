name: TORVO V2 Cloudflare Preview

on:
  push:
    branches: [torvo-v2-build]
  workflow_dispatch:

concurrency:
  group: torvo-v2-cloudflare-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CHECKOUT EXACT TORVO V2 COMMIT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: VERIFY V2 BRANCH BOUNDARY
        run: test "${GITHUB_REF_NAME}" = "torvo-v2-build"
      - name: SETUP NODE
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: INSTALL
        run: npm install --no-audit --no-fund
      - name: VERIFY DEALER AUTH CONTRACT
        run: npm run verify:v2-auth
      - name: VERIFY FINAL READINESS
        run: npm run verify:v2-ready
      - name: VERIFY DEALER BUSINESS BOUNDARY
        run: npm run verify:v2-dealer-business
      - name: VERIFY RELEASE GATES
        run: npm run verify:v2-release-gates
      - name: VERIFY RUNTIME READINESS CONTRACT
        run: npm run verify:v2-runtime
      - name: BUILD EXACT V2 COMMIT
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: STAMP DEPLOYED SOURCE SHA
        run: |
          test -f dist/index.html
          printf '%s' "${GITHUB_SHA}" > dist/torvo-build-sha.txt
          printf '%s\n' "BRANCH=${GITHUB_REF_NAME}" "SHA=${GITHUB_SHA}" "RUN_ID=${GITHUB_RUN_ID}" > dist/torvo-build-manifest.txt
      - name: VERIFY CLOUDFLARE CREDENTIALS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "MISSING CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "MISSING CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: DEPLOY EXACT V2 COMMIT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: VERIFY LIVE WORKER EXACT SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          LIVE_SHA="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 https://torvo-b2b-spare-parts.torvotools.workers.dev/torvo-build-sha.txt)"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          echo "VERIFIED LIVE TORVO V2 SHA: $LIVE_SHA"
      - name: DEPLOYMENT EVIDENCE
        run: |
          echo "### TORVO V2 CLOUDFLARE PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "- BRANCH: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EXACT SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- FULL V2 GATES: PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- LIVE SHA VERIFIED: YES" >> "$GITHUB_STEP_SUMMARY"
          echo "- WORKER: https://torvo-b2b-spare-parts.torvotools.workers.dev" >> "$GITHUB_STEP_SUMMARY"
