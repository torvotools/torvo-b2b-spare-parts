name: TORVO V2 Cloudflare Preview

on:
  # AUTO LIVE DEPLOY: run only after the canonical Build Check succeeds.
  workflow_run:
    workflows: ["TORVO V2 Build Check"]
    types: [completed]
    branches: [torvo-v2-build]
  workflow_dispatch:

concurrency:
  group: torvo-v2-cloudflare-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    timeout-minutes: 15
    steps:
      - name: CHECKOUT EXACT TORVO V2 COMMIT
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: VERIFY V2 BRANCH BOUNDARY
        run: test "${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}" = "torvo-v2-build"
      - name: SETUP NODE
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: INSTALL
        run: npm install --no-audit --no-fund
      - name: VERIFY V2 PREFLIGHT
        run: npm run verify:v2-preflight
      - name: VERIFY COMPLETE V2 CI CONTRACT
        run: |
          npm run verify:v2-ci
          npm run verify:v2-final-readiness
      - name: DETECT EXTERNAL DEPLOY CONFIG
        id: deploy_config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          READY=true
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "MISSING VITE_SUPABASE_URL"; READY=false; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then echo "MISSING VITE_SUPABASE_ANON_KEY"; READY=false; fi
          if [ -n "$VITE_SUPABASE_URL" ]; then case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "INVALID VITE_SUPABASE_URL"; READY=false;; esac; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "MISSING CLOUDFLARE_API_TOKEN"; READY=false; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "MISSING CLOUDFLARE_ACCOUNT_ID"; READY=false; fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = true ]; then echo "EXTERNAL DEPLOY CONFIG READY"; else echo "CODE VERIFIED; LIVE DEPLOY WAITING FOR REPOSITORY CONFIG"; fi
      - name: BUILD EXACT V2 COMMIT
        env:
          VITE_BUILD_SHA: ${{ env.SOURCE_SHA }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build --config vite.v2-preview.config.js && node scripts/normalize-v2-build.mjs
      - name: STAMP DEPLOYED SOURCE SHA
        run: |
          test -f dist/index.html
          printf '%s' "${SOURCE_SHA}" > dist/torvo-build-sha.txt
          printf '%s\n' "BRANCH=${GITHUB_REF_NAME}" "SHA=${SOURCE_SHA}" "RUN_ID=${GITHUB_RUN_ID}" > dist/torvo-build-manifest.txt
      - name: DEPLOY EXACT V2 COMMIT
        if: steps.deploy_config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: VERIFY LIVE WORKER EXACT SHA
        if: steps.deploy_config.outputs.ready == 'true'
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          LIVE_SHA=""
          for ATTEMPT in $(seq 1 24); do
            LIVE_SHA="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://torvo-b2b-spare-parts.torvotools.workers.dev/torvo-build-sha.txt?sha=${EXPECTED_SHA}&run=${GITHUB_RUN_ID}&attempt=${ATTEMPT}" || true)"
            LIVE_SHA="$(printf '%s' "$LIVE_SHA" | tr -d '\r\n[:space:]')"
            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then echo "VERIFIED LIVE TORVO V2 SHA: $LIVE_SHA"; break; fi
            echo "LIVE SHA NOT READY (ATTEMPT ${ATTEMPT}/24): ${LIVE_SHA:-EMPTY}"; sleep 8
          done
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          HEADER_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          curl --fail --silent --show-error -D "$HEADER_FILE" -o "$BODY_FILE" -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://torvo-b2b-spare-parts.torvotools.workers.dev/torvo-build-sha.txt?verify=${GITHUB_RUN_ID}"
          test "$(tr -d '\r\n[:space:]' < "$BODY_FILE")" = "$EXPECTED_SHA"
          if ! tr -d '\r' < "$HEADER_FILE" | grep -qi '^cache-control:.*no-store'; then echo "LIVE SHA BODY VERIFIED; CACHE-CONTROL HEADER PROPAGATION NOT READY"; fi
          if ! tr -d '\r' < "$HEADER_FILE" | grep -qi '^x-torvo-v2:.*ACTIVE'; then echo "LIVE SHA BODY VERIFIED; X-TORVO-V2 HEADER PROPAGATION NOT READY"; fi
          MANIFEST=""
          for ATTEMPT in $(seq 1 12); do
            MANIFEST="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "https://torvo-b2b-spare-parts.torvotools.workers.dev/torvo-build-manifest.json?verify=${GITHUB_RUN_ID}&attempt=${ATTEMPT}" || true)"
            if [[ "$MANIFEST" == *"${EXPECTED_SHA}"* ]]; then break; fi
            echo "LIVE MANIFEST NOT READY (ATTEMPT ${ATTEMPT}/12)"; sleep 3
          done
          if [[ "$MANIFEST" != *"${EXPECTED_SHA}"* ]]; then
            echo "LIVE MANIFEST DOES NOT CONTAIN EXPECTED SHA"
            exit 1
          fi
          rm -f "$HEADER_FILE" "$BODY_FILE"
          echo "LIVE CONFIG: SUPABASE + CLOUDFLARE READY"
          echo "LIVE PREVIEW: https://torvo-b2b-spare-parts.torvotools.workers.dev"
      - name: DEPLOYMENT EVIDENCE
        run: |
          echo "### TORVO V2 CLOUDFLARE PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "- BRANCH: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- EXACT SHA: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- FULL V2 GATES: PASSED" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deploy_config.outputs.ready }}" = "true" ]; then
            echo "- LIVE DEPLOY: VERIFIED" >> "$GITHUB_STEP_SUMMARY"
            echo "- LIVE CONFIG: SUPABASE + CLOUDFLARE READY" >> "$GITHUB_STEP_SUMMARY"
            echo "- LIVE PREVIEW: https://torvo-b2b-spare-parts.torvotools.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- LIVE DEPLOY: WAITING FOR SUPABASE/CLOUDFLARE REPOSITORY CONFIG" >> "$GITHUB_STEP_SUMMARY"
          fi
