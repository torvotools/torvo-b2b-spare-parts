name: TORVO Brand Master Fix
on:
  push:
    paths:
      - '.github/workflows/torvo-brand-master-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected no-flash Admin refresh patch
        run: python3 .github/torvo_brand_patch.py
      - name: Commit corrected no-flash Admin refresh
        run: |
          git config user.name "TORVO Admin Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Admin home flash during refresh"
          git push
