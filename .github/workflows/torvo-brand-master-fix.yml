name: TORVO Brand Master Fix
on:
  push:
    paths:
      - '.github/workflows/torvo-brand-master-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved Manage Brand UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html'); s=p.read_text(encoding='utf-8')
          old='''<div class="field"><label>BRAND *</label><div class="masterRow"><input id="pBrand" class="upper" list="brandList"><button class="mini" onclick="addMaster(&quot;brand&quot;,&quot;pBrand&quot;)">+</button><button class="mini edit" onclick="editMaster(&quot;brand&quot;,&quot;pBrand&quot;)">✎</button><button class="mini del" onclick="deleteMaster(&quot;brand&quot;,&quot;pBrand&quot;)">🗑</button></div></div>'''
          new='''<div class="field"><label>BRAND *</label><div class="masterRow"><input id="pBrand" class="upper" list="brandList"><button class="mini" type="button" onclick="torvoOpenBrandManager()">+</button><button class="mini" type="button" onclick="torvoToggleBrandDropdown()">▼</button></div><div id="torvoBrandDropdown" class="torvoBrandDropdown"></div></div>'''
          if s.count(old)!=1: raise SystemExit('Brand row exact source mismatch')
          s=s.replace(old,new,1)
          marker='''function setValidation(input,help,state,text){'''
          if s.count(marker)!=1: raise SystemExit('Function marker mismatch')
          js=r'''function torvoBrandNames(){return Array.from(new Set([].concat(DB.brands||[],(DB.items||[]).map(function(x){return x.brand}),(DB.machines||[]).map(function(x){return x.brand})).filter(Boolean).map(U))).sort()}
function torvoEnsureBrandUI(){if(E("torvoBrandManager"))return;var d=document.createElement("div");d.id="torvoBrandManager";d.className="torvoBrandOverlay";d.innerHTML='<div class="torvoBrandCard"><div class="torvoBrandHead"><b>MANAGE BRAND</b><button type="button" onclick="torvoCloseBrandManager()">×</button></div><div class="torvoBrandAdd"><input id="torvoBrandNew" class="upper" placeholder="ADD BRAND NAME"><button type="button" onclick="torvoAddBrand()">+ ADD</button></div><div id="torvoBrandMsg" class="torvoBrandMsg"></div><input id="torvoBrandSearch" class="torvoBrandSearch upper" placeholder="SEARCH BRAND" oninput="torvoRenderBrands()"><div id="torvoBrandRows" class="torvoBrandRows"></div></div>';document.body.appendChild(d)}
function torvoOpenBrandManager(){torvoEnsureBrandUI();E("torvoBrandManager").classList.add("show");E("torvoBrandNew").value="";E("torvoBrandSearch").value="";E("torvoBrandMsg").textContent="";torvoRenderBrands();setTimeout(function(){E("torvoBrandNew").focus()},30)}
function torvoCloseBrandManager(){var x=E("torvoBrandManager");if(x)x.classList.remove("show")}
function torvoBrandMessage(t,bad){var x=E("torvoBrandMsg");if(!x)return;x.textContent=t;x.className="torvoBrandMsg "+(bad?"bad":"ok")}
function torvoAddBrand(){var v=U((E("torvoBrandNew").value||"").trim());if(!v)return torvoBrandMessage("ENTER BRAND NAME",true);if(torvoBrandNames().some(function(x){return N(x)===N(v)}))return torvoBrandMessage("BRAND ALREADY EXISTS",true);DB.brands.push(v);if(E("pBrand"))E("pBrand").value=v;logActivity("MASTER ADDED: "+v);saveDB();E("torvoBrandNew").value="";torvoBrandMessage("✓ SUCCESSFUL — "+v+" ADDED",false);torvoRenderBrands()}
function torvoRenderBrands(){var q=N(E("torvoBrandSearch")?E("torvoBrandSearch").value:"");var a=torvoBrandNames().filter(function(v){return !q||N(v).includes(q)});E("torvoBrandRows").innerHTML=a.length?a.map(function(v){return '<div class="torvoBrandRow" data-brand="'+H(v)+'"><span>'+H(v)+'</span><div><button type="button" class="edit" onclick="torvoEditBrand(this)">EDIT</button><button type="button" class="del" onclick="torvoDeleteBrand(this)">DELETE</button></div></div>'}).join(""):'<div class="torvoBrandEmpty">NO BRAND FOUND</div>'}
function torvoEditBrand(btn){var row=btn.closest(".torvoBrandRow"),old=row.getAttribute("data-brand");if(masterUsage("brand",old)>0)return torvoBrandMessage("VALUE USED IN "+masterUsage("brand",old)+" RECORD(S). CHANGE LINKED RECORD FIRST",true);row.innerHTML='<input class="upper" value="'+H(old)+'"><div><button type="button" class="edit" onclick="torvoSaveBrandEdit(this,\''+H(old)+'\')">SAVE</button><button type="button" onclick="torvoRenderBrands()">CANCEL</button></div>';row.querySelector("input").focus()}
function torvoSaveBrandEdit(btn,old){var v=U((btn.closest(".torvoBrandRow").querySelector("input").value||"").trim());if(!v)return torvoBrandMessage("BRAND NAME REQUIRED",true);if(torvoBrandNames().some(function(x){return N(x)===N(v)&&N(x)!==N(old)}))return torvoBrandMessage("NEW VALUE ALREADY EXISTS",true);DB.brands=DB.brands.map(function(x){return N(x)===N(old)?v:x});if(E("pBrand")&&N(E("pBrand").value)===N(old))E("pBrand").value=v;logActivity("MASTER EDITED: "+old+" → "+v);saveDB();torvoBrandMessage("✓ SUCCESSFUL — BRAND UPDATED",false);torvoRenderBrands()}
function torvoDeleteBrand(btn){var row=btn.closest(".torvoBrandRow"),v=row.getAttribute("data-brand"),use=masterUsage("brand",v);if(use>0)return torvoBrandMessage("DELETE BLOCKED: USED IN "+use+" RECORD(S)",true);row.innerHTML='<span>'+H(v)+'</span><div class="torvoDeleteConfirm"><input inputmode="numeric" maxlength="4" placeholder="CODE 1122"><button type="button" class="del" onclick="torvoConfirmBrandDelete(this,\''+H(v)+'\')">CONFIRM</button><button type="button" onclick="torvoRenderBrands()">CANCEL</button></div>';row.querySelector("input").focus()}
function torvoConfirmBrandDelete(btn,v){var code=btn.closest(".torvoDeleteConfirm").querySelector("input").value;if(code!=="1122")return torvoBrandMessage("WRONG DELETE CODE",true);DB.brands=DB.brands.filter(function(x){return N(x)!==N(v)});if(E("pBrand")&&N(E("pBrand").value)===N(v))E("pBrand").value="";logActivity("MASTER DELETED: "+v);saveDB();sndDelete();torvoBrandMessage("✓ SUCCESSFUL — "+v+" DELETED",false);torvoRenderBrands()}
function torvoToggleBrandDropdown(){var box=E("torvoBrandDropdown");if(!box)return;var open=box.classList.toggle("show");if(!open)return;box.innerHTML=torvoBrandNames().map(function(v){return '<button type="button" onclick="torvoSelectBrand(this)" data-brand="'+H(v)+'">'+H(v)+'</button>'}).join("")||'<div class="torvoBrandEmpty">NO BRAND ADDED</div>'}
function torvoSelectBrand(btn){if(E("pBrand"))E("pBrand").value=btn.getAttribute("data-brand")||"";var box=E("torvoBrandDropdown");if(box)box.classList.remove("show")}
'''
          s=s.replace(marker,js+marker,1)
          css=r'''<style id="torvo-brand-manager-style">
.torvoBrandOverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:99999;align-items:center;justify-content:center;padding:16px}.torvoBrandOverlay.show{display:flex}.torvoBrandCard{width:min(500px,96vw);max-height:76vh;overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:14px}.torvoBrandHead{display:flex;align-items:center;justify-content:space-between;font-size:17px;margin-bottom:10px}.torvoBrandHead button{border:0;background:#eef2f7;border-radius:8px;width:34px;height:34px;font-size:24px;line-height:28px}.torvoBrandAdd{display:grid;grid-template-columns:1fr auto;gap:8px}.torvoBrandAdd input,.torvoBrandSearch{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-size:14px}.torvoBrandAdd button{border:0;border-radius:8px;padding:0 16px;background:#15803d;color:#fff;font-weight:800}.torvoBrandSearch{margin:9px 0}.torvoBrandMsg{min-height:18px;margin-top:6px;font-size:12px;font-weight:800}.torvoBrandMsg.ok{color:#15803d}.torvoBrandMsg.bad{color:#b91c1c}.torvoBrandRows{max-height:42vh;overflow:auto;border-top:1px solid #e2e8f0}.torvoBrandRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid #edf2f7;font-size:13px;font-weight:700}.torvoBrandRow>span{overflow-wrap:anywhere}.torvoBrandRow>div{display:flex;gap:5px;align-items:center}.torvoBrandRow button{border:0;border-radius:6px;padding:7px 9px;font-size:11px;font-weight:800}.torvoBrandRow .edit{background:#dbeafe;color:#1d4ed8}.torvoBrandRow .del{background:#fee2e2;color:#b91c1c}.torvoBrandRow input{min-width:0;width:180px;border:1px solid #94a3b8;border-radius:7px;padding:7px}.torvoDeleteConfirm input{width:82px}.torvoBrandDropdown{display:none;position:absolute;z-index:9000;margin-top:4px;width:min(320px,85vw);max-height:220px;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:4px}.torvoBrandDropdown.show{display:block}.torvoBrandDropdown button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px;border-bottom:1px solid #f1f5f9;font-weight:700}.torvoBrandEmpty{padding:12px;color:#64748b;text-align:center}
</style>
'''
          if '</head>' not in s: raise SystemExit('head marker missing')
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit approved change
        run: |
          git config user.name 'TORVO Admin Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add approved Manage Brand popup UI'
          git push
