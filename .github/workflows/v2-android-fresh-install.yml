name: TORVO V2 Side-by-Side QA APK

on:
  workflow_dispatch:
  push:
    branches: [torvo-v2-build]
    paths:
      - '.github/workflows/v2-android-fresh-install.yml'

permissions:
  contents: read

jobs:
  fresh-install-apk:
    if: github.ref_name == 'torvo-v2-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: CHECKOUT V2 ONLY
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: INSTALL AND VERIFY V2
        run: |
          npm install --no-audit --no-fund
          npm run verify:v2-preflight
          npm run verify:v2-auth
          npm run verify:v2-ready
          npm run verify:v2-dealer-business
          npm run verify:v2-release-gates
          npm run verify:v2-runtime
          npm run verify:v2-final-readiness
      - name: BUILD AND SYNC NATIVE APP
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm run build:app
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/public/v2.html
          grep -q 'torvo-v2-root' android/app/src/main/assets/public/v2.html
      - name: SET TEST VERSION CODE
        env:
          TEST_VERSION_CODE: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'android/app/build.gradle';
          let source = fs.readFileSync(path, 'utf8');
          const code = Number(process.env.TEST_VERSION_CODE);
          if (!Number.isSafeInteger(code) || code < 1) throw Error('Invalid versionCode');
          if ((source.match(/\bversionCode\s+\d+/g) || []).length !== 1) throw Error('Expected one versionCode');
          source = source.replace(/\bversionCode\s+\d+/, 'versionCode ' + code);
          fs.writeFileSync(path, source);
          NODE
      - name: ISOLATE TEST PACKAGE FROM INSTALLED APP
        shell: bash
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle <<'GRADLE'

          // Disposable side-by-side QA build; Android runner debug signing only.
          android {
              buildTypes {
                  debug {
                      applicationIdSuffix ".test"
                  }
              }
          }
          GRADLE
          echo "Side-by-side QA package: com.torvotools.app.test" >> "$GITHUB_STEP_SUMMARY"
      - name: BUILD FRESH INSTALL APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: VERIFY SIGNATURE AND PACKAGE
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.torvotools.app.test'"
          mkdir -p fresh-install-artifact
          cp "$APK" fresh-install-artifact/TORVO-TOOLS-SIDE-BY-SIDE-QA.apk
          sha256sum fresh-install-artifact/TORVO-TOOLS-SIDE-BY-SIDE-QA.apk > fresh-install-artifact/SHA256SUMS.txt
          echo "SIDE-BY-SIDE QA ONLY: com.torvotools.app.test; disposable debug certificate, NOT suitable for upgrades or production." >> "$GITHUB_STEP_SUMMARY"
      - name: UPLOAD ISOLATED TEST ARTIFACT ONLY
        uses: actions/upload-artifact@v4
        with:
          name: TORVO-SIDE-BY-SIDE-QA-${{ github.run_number }}
          path: fresh-install-artifact/
          if-no-files-found: error
          retention-days: 30
