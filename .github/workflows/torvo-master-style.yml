name: TORVO Admin Exact Reference V25
on:
  push:
    branches:
      - admin-ui-v25-exact-reference
    paths:
      - '.github/torvo_master_style_patch.py'
      - '.github/workflows/torvo-master-style.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-ui-v25-exact-reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V25 exact Admin structure
        run: python .github/torvo_master_style_patch.py
      - name: Verify actual V25 structure
        run: |
          grep -q 'TORVO ADMIN EXACT REFERENCE V25' admin.html
          grep -q 'class="v25menu"' admin.html
          grep -q '>DEALERS<' admin.html
          grep -q '>QUOTATION<' admin.html
          grep -q '>SALES ORDER<' admin.html
          grep -q '>ESTIMATES<' admin.html
          grep -q '>EMPLOYEES<' admin.html
          grep -q '>BACKUP & LOGS<' admin.html
          grep -q 'v23DashboardShell' admin.html
          grep -q 'WELCOME BACK, ADMIN!' admin.html
          grep -q 'spareFormHost' admin.html
      - name: Commit generated V25 Admin HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then echo 'NO HTML CHANGE'; else git commit -m 'Apply TORVO Admin exact reference V25'; git push origin HEAD:admin-ui-v25-exact-reference; fi
