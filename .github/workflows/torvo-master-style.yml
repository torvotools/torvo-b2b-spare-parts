name: TORVO Admin Exact Reference V21
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/torvo-master-style.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify TORVO exact Admin reference V21
        run: |
          grep -q 'TORVO EXACT ADMIN REFERENCE V21' admin.html
          grep -q 'torvo-exact-admin-reference-v21' admin.html
          echo 'V21 ADMIN UI VERIFIED ON MAIN'
