name: TORVO Admin Master Style
on:
  push:
    paths:
      - '.github/workflows/torvo-master-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Brand controls to Category standard
        run: python3 .github/torvo_master_style_patch.py
      - name: Commit Brand Category-standard controls
        run: |
          git config user.name "TORVO Admin Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Match Brand popup controls to Category"
          git push
