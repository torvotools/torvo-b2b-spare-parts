name: TORVO Admin UI Rebuild V20
on:
  push:
    branches:
      - admin-ui-rebuild
    paths:
      - '.github/workflows/torvo-master-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-ui-rebuild
      - name: Apply safe full Admin reference V20
        run: python3 .github/torvo_master_style_patch.py
      - name: Commit safe full Admin reference V20
        run: |
          git config user.name "TORVO Admin Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply safe full Admin reference V20"
          git push origin HEAD:admin-ui-rebuild
