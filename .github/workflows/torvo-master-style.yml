name: TORVO Admin Exact Reference V21
on:
  push:
    branches:
      - admin-ui-exact-reference
    paths:
      - '.github/workflows/torvo-master-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-ui-exact-reference
      - name: Apply TORVO exact Admin reference V21
        run: python3 .github/torvo_master_style_patch.py
      - name: Commit TORVO exact Admin reference V21
        run: |
          git config user.name "TORVO Admin Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply TORVO exact Admin reference V21"
          git push origin HEAD:admin-ui-exact-reference
