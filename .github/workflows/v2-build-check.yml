name: TORVO V2 Build Check

on:
  push:
    branches: [torvo-v2-build]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/verify-v2-auth-contract.mjs'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
      - '.github/workflows/v2-netlify-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/verify-v2-auth-contract.mjs'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
      - '.github/workflows/v2-netlify-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify branch boundary
        if: github.event_name != 'pull_request'
        run: test "${GITHUB_REF_NAME}" = "torvo-v2-build"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Dealer auth contract
        run: npm run verify:v2-auth

      - name: Build exact V2 commit
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Record verified SHA
        run: |
          test -f dist/index.html
          printf '%s\n' "${GITHUB_SHA}" > dist/torvo-build-sha.txt
          echo "VERIFIED V2 SHA ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
