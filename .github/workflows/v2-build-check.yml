name: TORVO V2 Build Check

on:
  push:
    branches: [torvo-v2-build]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/verify-v2-auth-contract.mjs'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/verify-v2-auth-contract.mjs'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Dealer auth contract
        run: npm run verify:v2-auth

      - name: Build V2
        run: npm run build
