name: TORVO V2 Build Check

on:
  push:
    branches: [torvo-v2-build]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/**'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
      - '.github/workflows/v2-netlify-preview.yml'
      - '.github/workflows/v2-cloudflare-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/v2/**'
      - 'v2.html'
      - 'package.json'
      - 'scripts/**'
      - 'supabase/v2-*.sql'
      - 'supabase/tests/v2-dealer-auth-security-checklist.sql'
      - 'supabase/V2_INSTALL_ORDER.md'
      - '.github/workflows/v2-build-check.yml'
      - '.github/workflows/v2-netlify-preview.yml'
      - '.github/workflows/v2-cloudflare-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify branch boundary
        if: github.event_name != 'pull_request'
        run: test "${GITHUB_REF_NAME}" = "torvo-v2-build"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify exact stamped V2 build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run verify:v2-build
      - name: Verify build identity
        run: |
          test "$(cat dist/torvo-build-sha.txt)" = "${GITHUB_SHA}"
          grep -q "${GITHUB_SHA}" dist/torvo-build-manifest.json
          grep -q 'TORVO V2' dist/torvo-build-manifest.json
          echo "VERIFIED V2 SHA ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
