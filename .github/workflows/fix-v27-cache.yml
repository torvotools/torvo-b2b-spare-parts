name: Fix V27 loader cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust V27 loader reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-v27-preview.html')
          s=p.read_text()
          old='<script src="admin-v27-loader.js"></script>'
          new='<script src="admin-v27-loader.js?v=20260908-99-final"></script>'
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-preview.html
          git commit -m "Cache-bust V27 loader on preview"
          git push