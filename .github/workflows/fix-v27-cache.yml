name: Lock V27 final search
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock final compact Home-style search
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          lp=Path('admin-v27-loader.js'); l=lp.read_text()
          l=re.sub(r'\.top\{height:82px!important;[^`]*?background:#fff!important\}', '.top{height:82px!important;padding:0 18px!important;gap:18px!important;display:flex!important;align-items:center!important;background:#fff!important}', l, count=1)
          l=re.sub(r'\.searchWrap\{position:relative!important;[^}]+\}', '.searchWrap{position:relative!important;width:68%!important;min-width:520px!important;max-width:760px!important;flex:0 1 760px!important;margin:0!important}', l, count=1)
          l=re.sub(r'@media\(max-width:900px\)\{\.searchWrap\{[^}]+\}', '@media(max-width:900px){.searchWrap{width:66%!important;min-width:430px!important;max-width:680px!important;flex:0 1 680px!important}', l, count=1)
          lp.write_text(l)
          p=Path('admin-v27-preview.html'); s=p.read_text()
          stamp=os.environ['GITHUB_SHA'][:12]
          s=re.sub(r'admin-v27-loader\.js(?:\?v=[^"\']*)?', 'admin-v27-loader.js?v='+stamp, s)
          p.write_text(s)
          PY
      - name: Commit final search
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-loader.js admin-v27-preview.html
          git commit -m "Lock compact Home-style Admin search"
          git push