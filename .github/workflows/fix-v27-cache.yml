name: Fix V27 loader cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize exact-page restore and Home-style search
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re

          lp=Path('admin-v27-loader.js')
          l=lp.read_text()
          # Search: compact Home-style bar, with remaining top space reserved for bell/profile.
          l=re.sub(r'\.top\{height:60px!important;[^`]*?background:#fff!important\}',
                   '.top{height:60px!important;padding:4px 14px!important;gap:10px!important;display:flex!important;align-items:center!important;background:#fff!important}',l,count=1)
          l=re.sub(r'\.searchWrap\{position:relative!important;width:[^}]+\}',
                   '.searchWrap{position:relative!important;width:min(720px,62%)!important;min-width:520px!important;max-width:720px!important;flex:0 1 720px!important;margin-right:auto!important}',l,count=1)
          l=l.replace('@media(max-width:760px){.top{grid-template-columns:minmax(500px,1fr) 60px 140px!important}.searchWrap{width:68%!important;min-width:0!important;max-width:820px!important}.profile{width:140px!important;min-width:140px!important}}',
                      '@media(max-width:760px){.top{min-width:600px!important}.searchWrap{width:68%!important;min-width:420px!important;max-width:680px!important;flex:0 1 680px!important}.profile{width:140px!important;min-width:140px!important}}')
          lp.write_text(l)

          p=Path('admin-v27-preview.html')
          s=p.read_text()
          # First paint must use the same final search geometry; no later jump.
          s=re.sub(r'\.top\{height:60px;background:#fff;border-bottom:1px solid #e1e6ee;[^}]+\}',
                   '.top{height:60px;background:#fff;border-bottom:1px solid #e1e6ee;display:flex;align-items:center;gap:10px;padding:4px 14px}',s,count=1)
          s=re.sub(r'\.searchWrap\{position:relative;width:68%;min-width:0;max-width:820px\}',
                   '.searchWrap{position:relative;width:min(720px,62%);min-width:520px;max-width:720px;flex:0 1 720px;margin-right:auto}',s,count=1)

          # Critical refresh fix: base HTML must restore the saved section BEFORE the body can paint.
          # This prevents Dashboard from appearing for one frame when refreshing another page.
          guard='<style id="torvo-v27-render-guard">html.torvo-v27-preload body{visibility:hidden!important}</style><script>document.documentElement.classList.add("torvo-v27-preload");setTimeout(function(){document.documentElement.classList.remove("torvo-v27-preload")},1800);</script>'
          newguard='<style id="torvo-v27-render-guard">html.torvo-v27-preload body{visibility:hidden!important}</style><script>document.documentElement.classList.add("torvo-v27-preload");window.TORVO_V27_BOOT_SECTION=(function(){try{return localStorage.getItem("TORVO_V27_SECTION")||"dashboard"}catch(e){return "dashboard"}})();</script>'
          s=s.replace(guard,newguard)

          # Replace delayed section restoration with immediate synchronous restoration, then reveal.
          s=s.replace("setTimeout(function(){show(localStorage.getItem('TORVO_V27_SECTION')||'dashboard')},150)",
                      "show(window.TORVO_V27_BOOT_SECTION||localStorage.getItem('TORVO_V27_SECTION')||'dashboard');document.documentElement.classList.remove('torvo-v27-preload')")

          stamp=os.environ['GITHUB_SHA'][:12]
          s=re.sub(r'admin-v27-loader\.js(?:\?v=[^"\']*)?', 'admin-v27-loader.js?v='+stamp, s)
          p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-preview.html admin-v27-loader.js
          git commit -m "Fix exact-page refresh and final Admin search"
          git push