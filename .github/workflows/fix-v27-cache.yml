name: Fix V27 loader cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact Home search styling into Admin
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          lp=Path('admin-v27-loader.js'); l=lp.read_text()
          # Exact Home search dimensions/style from index.html: 52px, #d8dbe0, 15px radius.
          # Admin has no ALL selector, so keep the same shell and the three controls on the right.
          l=re.sub(r'\.top\{height:60px!important;[^`]*?background:#fff!important\}',
                   '.top{height:82px!important;padding:0 18px!important;gap:18px!important;display:flex!important;align-items:center!important;background:#fff!important}',l,count=1)
          l=re.sub(r'\.searchWrap\{position:relative!important;[^}]+\}',
                   '.searchWrap{position:relative!important;width:min(760px,70%)!important;min-width:560px!important;max-width:760px!important;flex:0 1 760px!important;margin-right:auto!important}',l,count=1)
          l=re.sub(r'\.searchWrap>\.search\{[^}]+\}',
                   '.searchWrap>.search{width:100%!important;height:52px!important;border:2px solid #d8dbe0!important;border-radius:15px!important;display:grid!important;grid-template-columns:1fr 48px 48px 55px!important;overflow:hidden!important;background:#fff!important;padding:0!important;box-shadow:none!important}',l,count=1)
          l=re.sub(r'\.searchWrap>\.search>input\{[^}]+\}',
                   '.searchWrap>.search>input{width:100%!important;height:48px!important;border:0!important;outline:0!important;background:#fff!important;padding:0 13px!important;min-width:0!important;font-size:15px!important;font-weight:500!important;color:#596675!important;text-transform:uppercase!important}',l,count=1)
          l=re.sub(r'\.searchWrap>\.search>\.sicon\{[^}]+\}',
                   '.searchWrap>.search>.sicon{width:100%!important;height:48px!important;min-width:0!important;border:0!important;border-left:0!important;background:#fff!important;padding:0!important;display:grid!important;place-items:center!important;box-shadow:none!important}',l,count=1)
          l=re.sub(r'@media\(max-width:760px\)\{\.top\{[^}]+\}\.searchWrap\{[^}]+\}\.profile\{width:140px!important;min-width:140px!important\}\}',
                   '@media(max-width:760px){.top{min-width:600px!important;height:70px!important}.searchWrap{width:70%!important;min-width:440px!important;max-width:700px!important;flex:0 1 700px!important}.profile{width:140px!important;min-width:140px!important}}',l,count=1)
          lp.write_text(l)

          p=Path('admin-v27-preview.html'); s=p.read_text()
          # Match the same geometry in the first HTML paint too, preserving the now-correct refresh restoration.
          s=re.sub(r'\.top\{height:60px;background:#fff;border-bottom:1px solid #e1e6ee;[^}]+\}',
                   '.top{height:82px;background:#fff;border-bottom:1px solid #e1e6ee;display:flex;align-items:center;gap:18px;padding:0 18px}',s,count=1)
          s=re.sub(r'\.searchWrap\{position:relative;[^}]+\}',
                   '.searchWrap{position:relative;width:min(760px,70%);min-width:560px;max-width:760px;flex:0 1 760px;margin-right:auto}',s,count=1)
          s=re.sub(r'\.search\{width:100%;height:52px;[^}]+\}',
                   '.search{width:100%;height:52px;border:2px solid #d8dbe0;border-radius:15px;display:grid;grid-template-columns:1fr 48px 48px 55px;overflow:hidden;background:#fff;padding:0}',s,count=1)
          s=re.sub(r'\.search input\{height:48px;[^}]+\}',
                   '.search input{width:100%;height:48px;border:0;outline:0;background:#fff;padding:0 13px;min-width:0;font-size:15px;font-weight:500;color:#596675;text-transform:uppercase}',s,count=1)
          s=re.sub(r'\.sicon\{width:36px;height:48px;min-width:36px;[^}]+\}',
                   '.sicon{width:100%;height:48px;min-width:0;border:0;background:#fff;display:grid;place-items:center;padding:0}',s,count=1)
          stamp=os.environ['GITHUB_SHA'][:12]
          s=re.sub(r'admin-v27-loader\.js(?:\?v=[^"\']*)?', 'admin-v27-loader.js?v='+stamp, s)
          p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-preview.html admin-v27-loader.js
          git commit -m "Use exact Home search styling in Admin"
          git push