name: V27 preview cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust loader only
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('admin-v27-preview.html')
          s=p.read_text()
          stamp=os.environ['GITHUB_SHA'][:12]
          s=re.sub(r'admin-v27-loader\.js(?:\?v=[^"\']*)?', 'admin-v27-loader.js?v='+stamp, s)
          p.write_text(s)
          PY
      - name: Commit cache bust if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-preview.html
          git commit -m "Cache-bust V27 loader"
          git push