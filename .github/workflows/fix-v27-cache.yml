name: Fix V27 loader cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Home search proportions to Admin
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re
          lp=Path('admin-v27-loader.js'); l=lp.read_text()
          # Home header is 220px + 1fr + actions. Admin sidebar already replaces the 220px brand column,
          # therefore the search itself must occupy the remaining header track, not an arbitrary 62/70% width.
          l=re.sub(r'\.top\{height:82px!important;[^`]*?background:#fff!important\}',
                   '.top{height:82px!important;padding:0 18px!important;gap:18px!important;display:grid!important;grid-template-columns:minmax(0,1fr) 54px 145px!important;align-items:center!important;background:#fff!important}',l,count=1)
          l=re.sub(r'\.searchWrap\{position:relative!important;[^}]+\}',
                   '.searchWrap{position:relative!important;width:100%!important;min-width:0!important;max-width:none!important;margin:0!important}',l,count=1)
          l=re.sub(r'@media\(max-width:760px\)\{\.top\{[^}]+\}\.searchWrap\{[^}]+\}\.profile\{width:140px!important;min-width:140px!important\}\}',
                   '@media(max-width:760px){.top{min-width:600px!important;height:70px!important;grid-template-columns:minmax(390px,1fr) 50px 140px!important}.searchWrap{width:100%!important;min-width:0!important;max-width:none!important}.profile{width:140px!important;min-width:140px!important}}',l,count=1)
          lp.write_text(l)

          p=Path('admin-v27-preview.html'); s=p.read_text()
          s=re.sub(r'\.top\{height:82px;background:#fff;border-bottom:1px solid #e1e6ee;[^}]+\}',
                   '.top{height:82px;background:#fff;border-bottom:1px solid #e1e6ee;display:grid;grid-template-columns:minmax(0,1fr) 54px 145px;align-items:center;gap:18px;padding:0 18px}',s,count=1)
          s=re.sub(r'\.searchWrap\{position:relative;[^}]+\}',
                   '.searchWrap{position:relative;width:100%;min-width:0;max-width:none;margin:0}',s,count=1)
          stamp=os.environ['GITHUB_SHA'][:12]
          s=re.sub(r'admin-v27-loader\.js(?:\?v=[^"\']*)?', 'admin-v27-loader.js?v='+stamp, s)
          p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v27-preview.html admin-v27-loader.js
          git commit -m "Match Admin search to Home header proportions"
          git push